# ============================================================================
#  foxhack.fr — VPS / nginx  (fichier de référence, rien n'est appliqué tout
#  seul) : sudo cp deploy/nginx-foxhack.conf /etc/nginx/sites-available/
#  foxhack.fr && sudo ln -s ../sites-available/foxhack.fr /etc/nginx/
#  sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#
#  Les deux règles qui règlent ton « fond noir » sont marquées [FIX].
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name foxhack.fr www.foxhack.fr;
    return 301 https://foxhack.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.foxhack.fr;
    # ...ssl_certificate... (un seul certificat pour les deux noms suffit)
    return 301 https://foxhack.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name foxhack.fr;

    # ...ssl_certificate / ssl_certificate_key...

    # [FIX] Le dossier produit par `npm run build` : dist/, pas le dépôt,
    # pas `public/`. C'est dist/offsidian/index.html qui porte la page
    # Offsidian — s'il n'est pas là, nginx ne trouve rien et retombe sur
    # /index.html, c'est-à-dire l'accueil du portfolio sur fond noir.
    root /var/www/foxhack.fr/dist;
    index index.html;

    charset utf-8;
    sendfile on;
    tcp_nopush on;
    client_max_body_size 200m;   # les .bin / .exe des pages de projets

    gzip on;
    gzip_types text/css application/javascript application/json text/markdown image/svg+xml;

    # Un HTML pointing sur des assets au nom hashé : il ne doit JAMAIS être
    # gardé en cache, sinon après deux mises en ligne le navigateur réclame
    # des fichiers supprimés. Les locations ci-dessous écrasent cet en-tête.
    add_header Cache-Control "no-cache" always;

    # [FIX] Les pages en dossier sont canonisées avec leur slash final.
    # Sans ça, l'hôte peut retomber sur l'accueil à la place de la page dédiée.
    location = /offsidian { return 301 /offsidian/; }
    location = /evilfox   { return 301 /evilfox/; }
    location = /foxhid    { return 301 /foxhid/; }
    location = /reaper         { return 301 /reaper/; }
    location = /mfkey32        { return 301 /mfkey32/; }
    location = /tools          { return 301 /tools/; }

    # [FIX] Assets : un 404 franc, surtout pas le fallback. Si le fichier a
    # disparu (vieux build, upload partiel), /index.html servi en .js est
    # refusé par le navigateur (« MIME type text/html ») et la page reste
    # noire sans un mot. Avec =404 on voit l'erreur dans la console.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Le vault : fichiers normaux, aucun fallback.
    location /offsidian/vault/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public" always;
    }

    # Le reste : fichiers, dossiers (=> /offsidian/ sert offsidian/index.html
    # grâce à `index`), puis repli sur l'accueil pour les URLs inconnues.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 404 maison (public/404.html est recopié dans dist/ par le build).
    error_page 404 /404.html;
}
