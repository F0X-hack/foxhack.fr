<!doctype html>
<html lang="fr" class="dark" data-theme="dedsec">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="dark" />
    <title>Offsidian — Le vault cybersécurité de FoXhack</title>
    <meta
      name="description"
      content="Offsidian : 344 notes de cybersécurité offensive, outils, techniques et guides, consultables comme dans un vault Obsidian directement sur foxhack.fr."
    />
    <meta name="author" content="FoXhack" />
    <meta name="robots" content="index, follow, max-snippet:-1" />
    <link rel="canonical" href="https://foxhack.fr/offsidian/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FoXhack" />
    <meta property="og:title" content="Offsidian — Le vault cybersécurité de FoXhack" />
    <meta property="og:description" content="Un vault public de 344 notes : guides, techniques et outils de cybersécurité." />
    <meta property="og:url" content="https://foxhack.fr/offsidian/" />
    <meta property="og:image" content="https://foxhack.fr/og-image-7568422c.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Offsidian — Le vault cybersécurité de FoXhack" />
    <meta name="twitter:description" content="344 notes de cybersécurité consultables comme dans Obsidian, directement sur foxhack.fr." />
    <meta name="twitter:image" content="https://foxhack.fr/og-image-7568422c.png" />
    <!-- Le manifeste part en parallèle du JS : la première note s'affiche sans
         attendre la fin du téléchargement du bundle. -->
    <link rel="preload" as="fetch" crossorigin href="/offsidian/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <!-- Filet de sécurité : ce bloc est en ligne exprès. Si le CSS du bundle
         ne charge pas, c'est justement le moment où il doit rester lisible. -->
    <style>
      #offsidian-boot-error {
        display: none;
      }
      .offsidian-boot-error #offsidian-boot-error {
        display: block;
        margin: 4rem auto;
        max-width: 40rem;
        padding: 0 1.25rem;
        color: #ececed;
        font: 1rem/1.65 ui-monospace, "SFMono-Regular", Consolas, monospace;
      }
      .offsidian-boot-error #offsidian-boot-error h2 {
        margin: 0 0 0.75rem;
        color: #ff6a20;
        font-size: 1.35rem;
        letter-spacing: 0.04em;
      }
      .offsidian-boot-error #offsidian-boot-error a,
      .offsidian-boot-error #offsidian-boot-error button {
        display: inline-block;
        margin: 0.5rem 0.5rem 0 0;
        padding: 0.55rem 0.95rem;
        border: 1px solid #2a2a30;
        background: #131316;
        color: #ff8a4c;
        font: inherit;
        font-size: 0.9rem;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Offsidian — Le vault cybersécurité de FoXhack",
        "url": "https://foxhack.fr/offsidian/",
        "description": "Un vault public de 344 notes de cybersécurité, avec guides, techniques et outils.",
        "inLanguage": "fr",
        "isPartOf": { "@type": "WebSite", "name": "FoXhack", "url": "https://foxhack.fr/" },
        "mainEntity": {
          "@type": "CreativeWorkSeries",
          "name": "Offsidian",
          "numberOfItems": 344,
          "author": { "@type": "Person", "name": "FoXhack", "url": "https://foxhack.fr/" }
        }
      }
    </script>
  </head>
  <body class="offsidian-page">
    <div id="offsidian-root"></div>
    <div id="offsidian-boot-error" role="alert">
      <h2>OFFSIDIAN / VAULT NON AFFICHÉ</h2>
      <p>
        La page est chargée, mais le lecteur de notes ne s'est pas démarré : le
        fichier JavaScript ou <code>/offsidian/manifest.json</code> n'a pas été
        servi. Recharger suffit le plus souvent (le navigateur a gardé une
        vieille copie de la page).
      </p>
      <p>
        <button type="button" onclick="location.reload()">Recharger</button>
        <a href="/offsidian/">/offsidian/</a>
        <a href="/offsidian/vault/">Markdown brut</a>
        <a href="/">Retour au lab</a>
      </p>
    </div>
    <noscript>
      <p style="max-width: 42rem; margin: 4rem auto; padding: 0 1.25rem; font: 1rem/1.6 system-ui, sans-serif">
        Offsidian est un lecteur de vault : il a besoin de JavaScript pour ouvrir les
        344 notes. Les fichiers Markdown bruts restent disponibles dans
        <a href="/offsidian/vault/">/offsidian/vault/</a>.
      </p>
    </noscript>
    <script>
      /* URL canonique : /offsidian/index.html → /offsidian/ */
      if (/\/index\.html$/i.test(window.location.pathname)) {
        window.history.replaceState({}, '', '/offsidian/' + window.location.search + window.location.hash)
      }

      /* Une page noire sans explication est impossible à diagnostiquer : si un
         asset casse (404, MIME, cache périmé) ou que React ne monte pas, on
         affiche le bloc ci-dessus à la place du vide. */
      ;(function () {
        function empty() {
          var root = document.getElementById('offsidian-root')
          return !root || !root.childElementCount
        }
        function show() {
          /* React a monté, ou montera dans une milliseconde : on ne dit rien.
             Après le montage, une image de note introuvable ne doit pas faire
             croire à un lecteur cassé. */
          if (!empty()) return
          document.documentElement.classList.add('offsidian-boot-error')
        }
        window.addEventListener(
          'error',
          function (event) {
            if (event.target && event.target !== window) show()
          },
          true,
        )
        window.setTimeout(show, 6000)
      })()
    </script>
    <script type="module" src="/src/offsidian-main.tsx"></script>
  </body>
</html>
