<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="FOXHACK — rappel visuel de sensibilisation à la sécurité des postes.">
  <title>FOXHACK</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #000;
      --text: #f5f2ed;
      --muted: #a79c92;
      --alert: #f32943;
      --amber: #ffc160;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { min-width: 320px; overflow-x: hidden; background: #000; color: var(--text); font-family: var(--sans); }

    /* The entry screen intentionally contains only the centered pseudo field. */
    .entry-screen {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #000;
    }
    .entry-form { width: min(360px, 100%); margin: 0; }
    .entry-mascot-link {
      position: absolute;
      top: auto;
      right: clamp(18px, 4vw, 40px);
      bottom: clamp(18px, 4vh, 38px);
      left: auto;
      z-index: 2;
      display: block;
      max-width: calc(100vw - 24px);
      transform: none;
      color: #ff6900;
      text-decoration: none;
      text-align: left;
    }
    .entry-mascot-link .ascii {
      margin: 0;
      color: inherit;
      font: 12px/1.12 "Courier New", "Lucida Console", monospace;
      white-space: pre;
      text-shadow: 0 0 10px rgba(255,105,0,.48);
      transition: color .18s, text-shadow .18s;
    }
    .entry-mascot-link .ascii b { font-weight: 700; }
    .entry-mascot-link:hover .ascii,
    .entry-mascot-link:focus-visible .ascii {
      color: #ffb84d;
      text-shadow: 0 0 14px rgba(255,105,0,.9);
    }
    .entry-mascot-link::after {
      content: "site du meilleur hacker :)";
      position: absolute;
      top: auto;
      right: 0;
      bottom: calc(100% + 11px);
      left: auto;
      z-index: 3;
      padding: 7px 10px;
      border: 1px solid rgba(255,105,0,.65);
      border-radius: 3px;
      background: rgba(24,12,6,.97);
      color: #fff0df;
      font: 10px var(--mono);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity .16s, transform .16s;
    }
    .entry-mascot-link:hover::after,
    .entry-mascot-link:focus-visible::after {
      opacity: 1;
      transform: translateY(0);
    }
    .pseudo-input {
      display: block;
      width: 100%;
      height: 54px;
      padding: 0 18px;
      border: 1px solid #252525;
      border-radius: 2px;
      outline: none;
      background: #000;
      color: #f5f5f5;
      text-align: center;
      font: 12px var(--mono);
      letter-spacing: .035em;
      transition: border-color .18s, box-shadow .18s;
    }
    .pseudo-input::placeholder { color: #777; opacity: 1; }
    .pseudo-input:focus { border-color: #f32943; box-shadow: 0 0 0 1px rgba(243,41,67,.7); }
    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .alert-screen.active { display: block; animation: reveal .3s ease-out both; }
    .alert-screen::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: linear-gradient(90deg,rgba(0,0,0,.63),rgba(0,0,0,.32) 50%,rgba(0,0,0,.38)), linear-gradient(0deg,rgba(0,0,0,.49),rgba(0,0,0,.14) 52%,rgba(0,0,0,.32));
    }
    .alert-shell { position: relative; z-index: 1; display: grid; place-items: center; width: 100%; min-height: 100vh; min-height: 100svh; margin: 0 auto; padding: 28px; }
    .alert-copy { width: 100%; max-width: 1180px; margin: auto; text-align: center; }
    .alert-copy h1 { margin: 0; color: #fff; font: 700 clamp(2.3rem,9vw,8rem)/.9 "Courier New", "Lucida Console", var(--mono); letter-spacing: -.045em; text-shadow: 2px 0 rgba(243,41,67,.28), 0 4px 28px rgba(0,0,0,.95),0 0 40px rgba(0,0,0,.7); }
    .alert-copy h1 span { display: inline-block; color: var(--alert); letter-spacing: -.065em; text-shadow: -1px 0 rgba(255,255,255,.18), 0 4px 28px rgba(0,0,0,.95),0 0 38px rgba(243,41,67,.45); }
    .alert-user { display: flex; justify-content: center; align-items: baseline; flex-wrap: wrap; gap: .28em; margin: 15px 0 38px; color: #fff; font: 700 clamp(1.7rem,5vw,5rem)/.98 "Courier New", "Lucida Console", var(--mono); letter-spacing: -.045em; text-shadow: 0 4px 25px rgba(0,0,0,.98); }
    .alert-user span { color: #fff; }
    .alert-user strong { color: var(--alert); font-weight: 700; overflow-wrap: anywhere; text-shadow: 1px 0 rgba(255,255,255,.13), 0 3px 24px rgba(0,0,0,.95),0 0 26px rgba(243,41,67,.4); }
    .prevention { margin: 0; color: #fff; font: 700 clamp(13px,2vw,20px)/1.5 "Courier New", "Lucida Console", var(--mono); letter-spacing: .035em; text-transform: uppercase; text-shadow: 0 3px 22px rgba(0,0,0,1),0 0 12px rgba(0,0,0,.85); }
    .prevention span { color: var(--alert); }
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 740px) {
      .alert-shell { padding: 24px; }
      .alert-copy h1 { font-size: clamp(2.3rem,9vw,5.8rem); }
      .alert-user { font-size: clamp(1.7rem,6.5vw,3.3rem); margin-bottom: 30px; }
    }
    @media (max-width: 480px) {
      .entry-mascot-link .ascii { font-size: clamp(7px,2.55vw,10px); }
      .alert-shell { padding: 18px; }
      .alert-copy h1 { font-size: clamp(2.3rem,9vw,3.7rem); }
      .alert-user { font-size: clamp(1.55rem,8vw,2.6rem); margin: 13px 0 25px; }
      .prevention { font-size: 12px; }
    }
    @media (max-width: 350px) {
      .alert-copy h1 { font-size: 2.15rem; }
      .alert-user { font-size: 1.4rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

<body>
  <main class="entry-screen" id="entryScreen">
    <a class="entry-mascot-link" href="https://foxhack.fr/" aria-label="Site du meilleur hacker — foxhack.fr">
      <figure class="ascii" aria-hidden="true"><b>      _,-=._              /|_/|
      `-.)   `=._,.-=-._.,  @ @._,
         `._ _,-.   )      _,.-'
            `    G.m-"^m`m'</b></figure>
    </a>
    <form class="entry-form" id="launchForm">
      <label class="visually-hidden" for="pseudoInput">Pseudo à afficher dans l'alerte</label>
      <input class="pseudo-input" id="pseudoInput" name="pseudo" type="text" placeholder="Pseudo à afficher" maxlength="26" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <button class="visually-hidden" type="submit">Afficher l'alerte</button>
    </form>
  </main>

  <section class="alert-screen" id="alertScreen" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="alertHeading" tabindex="-1">
    <div class="alert-shell">
      <div class="alert-copy">
        <h1 id="alertHeading">YOU HAVE<br><span>BEEN HACKED</span></h1>
        <p class="alert-user"><span>BY</span><strong id="alertPseudo">PSEUDO</strong></p>
        <p class="prevention"><span>Prévention //</span> Verrouille ton PC avant de partir.</p>
      </div>
    </div>
  </section>

  <script>
    const launchForm = document.getElementById('launchForm');
    const pseudoInput = document.getElementById('pseudoInput');
    const entryScreen = document.getElementById('entryScreen');
    const alertScreen = document.getElementById('alertScreen');
    const alertPseudo = document.getElementById('alertPseudo');

    function normalizedPseudo(value) {
      return value.trim().replace(/\s+/g, ' ').slice(0, 26);
    }

    function hideAlert() {
      alertScreen.classList.remove('active');
      alertScreen.setAttribute('aria-hidden', 'true');
      entryScreen.setAttribute('aria-hidden', 'false');
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
      pseudoInput.focus({ preventScroll: true });
    }

    launchForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const pseudo = normalizedPseudo(pseudoInput.value);
      if (!pseudo) {
        pseudoInput.focus();
        return;
      }
      alertPseudo.textContent = pseudo.toLocaleUpperCase('fr-FR');
      entryScreen.setAttribute('aria-hidden', 'true');
      alertScreen.classList.add('active');
      alertScreen.setAttribute('aria-hidden', 'false');
      alertScreen.focus({ preventScroll: true });

      // Fullscreen is requested only after the user submits the pseudo.
      // If the browser blocks it, the alert still fills the available page.
      if (document.documentElement.requestFullscreen) {
        try {
          const request = document.documentElement.requestFullscreen({ navigationUI: 'hide' });
          if (request && typeof request.catch === 'function') request.catch(() => {});
        } catch (error) { /* keep the in-page full-screen alert */ }
      }
    });

    document.addEventListener('fullscreenchange', () => {
      // Escape exits browser fullscreen; also dismiss the visual to return to the input.
      if (!document.fullscreenElement && alertScreen.classList.contains('active')) {
        alertScreen.classList.remove('active');
        alertScreen.setAttribute('aria-hidden', 'true');
        entryScreen.setAttribute('aria-hidden', 'false');
        pseudoInput.focus({ preventScroll: true });
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && alertScreen.classList.contains('active')) hideAlert();
