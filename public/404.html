<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404 — Page not found | FoXhack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #040406;
      color: #ececed;
      font-family: 'Space Mono', monospace, monospace;
      line-height: 1.6;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    .code {
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 700;
      color: #ff1a2e;
      text-shadow: 0 0 30px rgba(255,26,46,.5);
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); margin-bottom: 1rem; color: #fff; }
    p { color: #8a8d9a; margin-bottom: 2rem; }
    a {
      display: inline-block;
      padding: 0.8rem 1.5rem;
      background: #ff1a2e;
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background .2s, box-shadow .2s;
    }
    a:hover { background: #ff3a4e; box-shadow: 0 0 20px rgba(255,26,46,.5); }
    .links { margin-top: 2rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; font-size: 0.75rem; }
    .links a { background: transparent; border: 1px solid #1c1c24; color: #8a8d9a; padding: 0.5rem 1rem; }
    .links a:hover { border-color: #ff1a2e; color: #ff1a2e; background: transparent; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The path you're looking for doesn't exist or has been moved.</p>
    <a href="/">← Back to FoXhack Lab</a>
    <div class="links">
      <a href="/evilfox/">EvilFoX</a>
      <a href="/reaper/">Reaper</a>
      <a href="/foxhid/">FoX-HID</a>
      <a href="/mfkey32/">Mfkey32</a>
      <a href="/tools/">Outils</a>
      <a href="/offsidian/">Offsidian Notes</a>
      <a href="https://github.com/F0X-hack">GitHub</a>
    </div>
  </div>
</body>
</html>
